name: deploy pulumi

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-pulumi-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-pulumi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup aws credentials ${{ inputs.environment }}
        uses: ./.github/actions/setup-aws-credentials
        with:
          role-arn: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: setup python
        uses: ./.github/actions/setup-python

      - uses: pulumi/actions@v4
        with:
          command: up
          stack-name: ${{ vars.PULUMI_ORG }}/agent-harness/${{ inputs.environment }}
          work-dir: infrastructure
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
