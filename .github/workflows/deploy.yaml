name: deploy

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  BUCKET: ${{ vars.DEPLOY_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  RELEASE_NAME: ${{ github.event.repository.name }}

jobs:
  pulumi-staging:
    uses: ./.github/workflows/deploy_pulumi.yaml
    with:
      environment: staging
    secrets: inherit

  deploy:
    needs: [pulumi-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build dashboard ui
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: package release
        run: tar czf "/tmp/$RELEASE_NAME.tgz" --exclude .git --exclude .venv --exclude local --exclude ui/node_modules .

      - name: upload release
        run: aws s3 cp "/tmp/$RELEASE_NAME.tgz" "s3://$BUCKET/deploy/$RELEASE_NAME-$GITHUB_REF_NAME-$GITHUB_SHA.tgz" --only-show-errors

      - name: update host via ssm
        run: |
          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=${{ vars.HOST_INSTANCE_TAG }}" \
            --comment "deploy $GITHUB_REF_NAME ($GITHUB_SHA)" \
            --parameters "commands=[\"/opt/agent-harness/deploy/remote-update.sh s3://$BUCKET/deploy/$RELEASE_NAME-$GITHUB_REF_NAME-$GITHUB_SHA.tgz\"],executionTimeout=[\"600\"]" \
            --query 'Command.CommandId' --output text)
          echo "command: $command_id"
          for i in $(seq 1 60); do
            sleep 10
            invocation=$(aws ssm list-command-invocations --command-id "$command_id" --details \
              --query 'CommandInvocations[0].{Status:Status,Output:CommandPlugins[0].Output}' --output json)
            command_status=$(echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Status"])')
            echo "status: $command_status"
            case "$command_status" in
              Success)
                echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Output"])'
                exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Output"])'
                exit 1 ;;
            esac
          done
          echo "timed out waiting for the ssm command"
          exit 1
