name: pull request checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e '.[dev]'
      - name: lint
        run: flake8 taskboy tests
      - name: format
        run: |
          black --check taskboy tests spike
          isort --check taskboy tests spike
      - name: type
        run: mypy taskboy
      - name: test
        run: pytest --disable-pytest-warnings -vv -p no:cacheprovider --show-capture=no

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build dashboard ui
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheel and verify package data
        run: |
          pip install -q build
          python -m build --wheel
          python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); missing = [n for n in ['taskboy/templates/config.example.yaml', 'taskboy/templates/services/slack.yaml', 'taskboy/templates/services/github.yaml', 'taskboy/templates/services/jira.yaml', 'taskboy/templates/services/confluence.yaml', 'taskboy/templates/services/sentry.yaml', 'taskboy/templates/services/aws.yaml', 'taskboy/templates/skills/review/SKILL.md', 'taskboy/deploy/taskboy.service', 'taskboy/deploy/install.sh', 'taskboy/deploy/remote-update.sh', 'taskboy/deploy/git-cred-helper.py', 'taskboy/ui_dist/index.html'] if n not in names]; assert not missing, f'wheel is missing package data: {missing}'"
