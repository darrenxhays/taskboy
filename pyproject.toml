[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Self-hosted AI engineering agent: Slack-driven orchestrator running isolated Claude sub-agents"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.1",
    "pyjwt[crypto]>=2.8",
    "boto3>=1.34",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "ruamel.yaml>=0.18",  # comment-preserving config edits in the setup wizard only
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "black==25.12.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]
# added in later phases: claude-agent-sdk (phase 3), boto3 (phase 4+)

[project.scripts]
agent-harness = "agent_harness.cli:main"

[tool.setuptools]
packages = ["agent_harness", "agent_harness.adapters", "agent_harness.dashboard"]

[tool.black]
line-length = 300
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 300

[tool.mypy]
ignore_missing_imports = true
exclude = ["spike", "infrastructure"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
