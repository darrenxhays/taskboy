[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "taskboy"
dynamic = ["version"]
description = "TaskBoy: self-hosted AI engineering agent — Slack-driven orchestrator running isolated Claude sub-agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.2.152",  # ResultError / api_error_status for transient-failure retries
    "pyjwt[crypto]>=2.8",
    "boto3>=1.34",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "ruamel.yaml>=0.18",  # comment-preserving config edits in the setup wizard only
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "black==25.12.0",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]
# added in later phases: claude-agent-sdk (phase 3), boto3 (phase 4+)

[project.scripts]
taskboy = "taskboy.cli:main"

[tool.setuptools]
packages = ["taskboy", "taskboy.adapters", "taskboy.dashboard"]

[tool.setuptools.package-data]
# non-code assets shipped in the wheel: seed templates, host deploy files, built dashboard
taskboy = ["templates/**/*", "deploy/*", "ui_dist/**/*"]

[tool.setuptools_scm]
# version comes from the vX.Y.Z git tag; fallback covers builds outside a git checkout
fallback_version = "0.0.0"

[tool.black]
line-length = 300
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 300

[tool.mypy]
ignore_missing_imports = true
exclude = ["spike"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
